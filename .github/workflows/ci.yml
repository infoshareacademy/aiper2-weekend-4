on: push

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v6
    - run: uv sync
    - run: uv run pytest
