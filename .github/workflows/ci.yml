on: push

env:
  FORCE_COLOR: 1
  PY_COLORS: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked
    - name: Lint
      run: uv run ruff check src tests scripts
    - name: Check formatting
      run: uv run black --check src tests scripts
    - name: Check types
      run: uv run mypy src tests scripts
  test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --locked
    - run: uv run pytest --cov --cov-report=term-missing --cov-report=html --cov-fail-under=90
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-${{ matrix.os }}
        path: htmlcov/
